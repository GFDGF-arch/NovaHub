function requestDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{
   const d=req.result;
   if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta");
   if(!d.objectStoreNames.contains("files")){const s=d.createObjectStore("files",{keyPath:"id",autoIncrement:true});s.createIndex("path","path",{unique:false});}
  };
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function getMeta(key){return new Promise((res,rej)=>{let r=tx("meta").get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function setMeta(key,value){return new Promise((res,rej)=>{let r=tx("meta","readwrite").put(value,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function getAllFiles(){return new Promise((res,rej)=>{let r=tx("files").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function addFile(file){return new Promise((res,rej)=>{let r=tx("files","readwrite").add(file);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function deleteFile(id){return new Promise((res,rej)=>{let r=tx("files","readwrite").delete(Number(id));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function updateFile(id,changes){return new Promise(async(res,rej)=>{try{let s=tx("files","readwrite"),r=s.get(Number(id));r.onsuccess=()=>{s.put({...r.result,...changes});res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function boot(){
 try{db=await requestDB();const saved=await getMeta("settings");if(saved){if(saved.wallpaper)$("wallpaper").style.background=saved.wallpaper;if(saved.desktopColor)document.documentElement.style.setProperty("--desktop",saved.desktopColor);if(saved.iconPositions)iconPositions=saved.iconPositions;}
 const installed=await getMeta("installed");Object.keys(catalog).forEach(id=>{if(!apps[id])apps[id]={...catalog[id],installed:false};});Object.keys(newApps).forEach(id=>{if(!apps[id])apps[id]={...newApps[id]};});if(installed)Object.keys(installed).forEach(id=>{if(apps[id])apps[id].installed=installed[id]===true;});
 Object.entries(apps).forEach(([id,a])=>{a.description=a.description||appDescriptions[id]||`${a.name} is a NovaWare ${storeCategory(id)==="games"?"game":storeCategory(id)==="media"?"media tool":"desktop utility"}. Open it from the desktop to explore its features and tools.`;});
 // Core system applications cannot be uninstalled and are not listed in NovaStore.
 ["browser","filemanager","store","settings","about","terminal"].forEach(id=>{if(apps[id])apps[id].installed=true;});
 await seedFS();renderIcons();renderStart();updateClock();setInterval(()=>{updateClock();updateDesktopWidget()},1000);notify("Welcome to NovaWare 8.2","Your upgraded desktop is ready. Explore the new themes and notification center.");
 }catch(e){console.error(e);toast("NovaFS could not initialize. Browser storage may be disabled.");renderIcons();}
 setTimeout(()=>$("boot").style.display="none",1150);
}
async function seedFS(){

 await setMeta("seeded",true);
}

 Object.keys(apps).forEach((id,index)=>{if(!apps[id].installed)return;const el=document.createElement("div");el.className="icon";el.dataset.id=id;
 el.innerHTML=`<span class="emoji">${apps[id].icon}</span><span class="name">${escapeHTML(apps[id].name)}</span>`;
 const p=iconPositions[id];el.style.left=(p?.x??12+Math.floor(index/7)*92)+"px";el.style.top=(p?.y??10+(index%7)*88)+"px";
 el.addEventListener("click",()=>{document.querySelectorAll(".icon").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")});
 el.addEventListener("dblclick",()=>openApp(id));makeIconDraggable(el);$("icons").appendChild(el);
 });

}
function makeIconDraggable(el){let sx,sy,ox,oy,moved=false;el.addEventListener("pointerdown",e=>{if(e.button!==0)return;sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);moved=false;el.setPointerCapture(e.pointerId);
 const move=ev=>{let dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved){el.style.left=Math.max(0,Math.min(innerWidth-84,ox+dx))+"px";el.style.top=Math.max(0,Math.min(innerHeight-120,oy+dy))+"px"}};
 const stop=()=>{if(moved)iconPositions[el.dataset.id]={x:parseFloat(el.style.left),y:parseFloat(el.style.top)};el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",stop);saveSettings()};el.addEventListener("pointermove",move);el.addEventListener("pointerup",stop);});}
function renderStart(){$("startItems").innerHTML=Object.keys(apps).filter(id=>apps[id].installed&&!["store","about"].includes(id)).map(id=>`<button class="menuitem" onclick="openApp('${id}')">${apps[id].icon} ${escapeHTML(apps[id].name)}</button>`).join("")}

const novaOpenedApps = new Set(JSON.parse(localStorage.getItem("novaOpenedApps_v1") || "[]"));

function recordAppVisit(id){

 if(!novaEasterEggUnlocked && installedIds.length>0 && remaining.length===0){
  novaEasterEggUnlocked=true;
  localStorage.setItem("novaEasterEggUnlocked_v1","yes");
  setTimeout(showNovaEasterEggError,350);

}

}

function openApp(id){

document.addEventListener('pointerup',e=>{if(!solHold)return;let h=solHold;solHold=null;let pile=h.src==='w'?solitaireWaste:solitaireTableau[Number(h.src.slice(1))],card=pile?.[h.index];if(!card)return;if(!card.up){if(!h.moved&&h.src[0]==='t'){card.up=true;solitaireScore+=5;renderSolitaire()}return}if(!h.moved||Date.now()-h.time<120)return;let el=document.elementFromPoint(e.clientX,e.clientY);let foundation=el?.closest('[data-sol-foundation]'),column=el?.closest('[data-sol-column]');solitaireSelected={src:h.src,index:h.index};if(foundation)solTryMove('f'+foundation.dataset.solFoundation,0);else if(column)solTryMove('t'+column.dataset.solColumn,0);else{solitaireSelected=null;renderSolitaire()} });
function solClick(src,index){let pile=src==='w'?solitaireWaste:solitaireTableau[Number(src.slice(1))];let c=pile?.[index];if(!c||!c.up){if(src[0]==='t'&&c){c.up=true;solitaireScore+=5;renderSolitaire()}return}if(solitaireSelected){if(solitaireSelected.src===src&&solitaireSelected.index===index){solitaireSelected=null;renderSolitaire();return}if(solTryMove(src,index))return}solitaireSelected={src,index};renderSolitaire()}
function solTryMove(dest,index){let sel=solitaireSelected;if(!sel)return false;let source=sel.src==='w'?solitaireWaste:solitaireTableau[Number(sel.src.slice(1))],moving=source.slice(sel.index),card=moving[0];if(!card||moving.some(c=>!c.up))return false;if(dest==='w'||dest===sel.src)return false;if(dest[0]==='t'){let target=solitaireTableau[Number(dest.slice(1))],top=target.at(-1);if(top?(top.up&&solColor(top)!==solColor(card)&&top.v===card.v+1):card.v===13){target.push(...moving);source.splice(sel.index);if(sel.src[0]==='t'&&source.length&&!source.at(-1).up){source.at(-1).up=true;solitaireScore+=5}solitaireSelected=null;solitaireMoves++;renderSolitaire();return true}}if(dest[0]==='f'&&moving.length===1){let suit=dest[1],foundation=solitaireFoundations[suit],top=foundation.at(-1);if(card.s===suit&&card.v===(top?top.v+1:1)){foundation.push(source.pop());if(sel.src[0]==='t'&&source.length&&!source.at(-1).up){source.at(-1).up=true;solitaireScore+=5}solitaireScore+=10;solitaireMoves++;solitaireSelected=null;renderSolitaire();solCheckWin();return true}}return false}
function solFoundationClick(s){if(solitaireSelected){solTryMove('f'+s,0);return}let c=solitaireWaste.at(-1);if(c&&c.s===s&&c.v===(solitaireFoundations[s].length+1)){solitaireFoundations[s].push(solitaireWaste.pop());solitaireScore+=10;solitaireMoves++;renderSolitaire();solCheckWin()}}
function solColumnEmpty(i){if(solitaireSelected){if(solTryMove('t'+i,0))return} }
function solDouble(src,index){let pile=src==='w'?solitaireWaste:solitaireTableau[Number(src.slice(1))],c=pile?.[index];if(!c||!c.up)return;let f=solitaireFoundations[c.s],top=f.at(-1);if(c.v===(top?top.v+1:1)){f.push(pile.pop());if(src[0]==='t'&&pile.length&&!pile.at(-1).up){pile.at(-1).up=true;solitaireScore+=5}solitaireScore+=10;solitaireMoves++;solitaireSelected=null;renderSolitaire();solCheckWin()}}
function solCheckWin(){if(Object.values(solitaireFoundations).every(p=>p.length===13)){clearInterval(solitaireClock);$('solitaireStatus').textContent='You won! All 52 cards are home. 🎉';solitaireScore+=100}}
function solMenu(which){let p=$('solMenuPanel');if(!p)return;if(p.style.display!=='none'&&p.dataset.menu===which){p.style.display='none';return}p.dataset.menu=which;p.style.display='block';if(which==='game')p.innerHTML=`<button onclick="newSolitaire();solMenu('game')">New Game</button> <button onclick="solUndoHint()">Hint</button>`;else if(which==='options')p.innerHTML=`Draw cards: <button onclick="solitaireDrawMode=1;renderSolitaire();solMenu('options')">One</button> <button onclick="solitaireDrawMode=3;renderSolitaire();solMenu('options')">Three</button><br>Card backs: ${solBacks.map((v,i)=>`<button title="Card back ${i+1}" onclick="solBackStyle=${i};document.documentElement.style.setProperty('--sol-back',solBacks[${i}]);solMenu('options')" style="width:30px;height:38px;background:${v};border:2px outset white;margin:4px"></button>`).join('')}`;else p.innerHTML=`<b>Klondike Solitaire</b><p>Build foundations from Ace to King. Tableau columns descend in alternating colors. Only Kings may fill empty columns. Draw ${solitaireDrawMode} card${solitaireDrawMode===1?'':'s'} from the stock.</p><button onclick="solMenu('help')">Close</button>`}
function solUndoHint(){let found=false;for(let i=0;i<7&&!found;i++){let p=solitaireTableau[i],c=p.at(-1);if(c?.up){let f=solitaireFoundations[c.s];if(c.v===f.length+1){$('solitaireStatus').textContent='Hint: try moving '+solRanks[c.v]+suitSymbols[c.s]+' to its foundation.';found=true}}}if(!found)$('solitaireStatus').textContent='Try alternating-color descending moves between columns.'}
function renderSolStats(){if(!$('solScore'))return;$('solScore').textContent='Score: '+solitaireScore;$('solMoves').textContent='Moves: '+solitaireMoves;$('solTime').textContent='Time: '+String(Math.floor(solitaireSeconds/60)).padStart(2,'0')+':'+String(solitaireSeconds%60).padStart(2,'0')}
function shutdown(){if(confirm("Shut down NovaWare?")){$("boot").style.display="flex";$("boot").querySelector("div:nth-child(2)").textContent="NovaWare is shutting down...";setTimeout(()=>{$("boot").style.display="none";toast("NovaWare is still running in this tab.")},900)}}
/* Minesweeper */
let mw,mh,mm,mineCells=[],mineOver=false,mineFirst=true;function newMineGame(){clearInterval(mineInterval);[mw,mh,mm]=$("difficulty").value.split(",").map(Number);mineCells=Array.from({length:mw*mh},()=>({mine:false,open:false,flag:false,num:0}));mineOver=false;mineFirst=true;mineSeconds=0;$("mineTime").textContent=0;$("mineCount").textContent=mm;$("mineStatus").textContent="Good luck!";renderMines()}
function mineNeighbors(i){let x=i%mw,y=Math.floor(i/mw),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&nx<mw&&ny>=0&&ny<mh)a.push(ny*mw+nx)}return a}
function generateMines(safe){let forbidden=[safe,...mineNeighbors(safe)],count=0;while(count<mm){let i=Math.floor(Math.random()*mineCells.length);if(!mineCells[i].mine&&!forbidden.includes(i)){mineCells[i].mine=true;count++}}mineCells.forEach((c,i)=>{if(!c.mine)c.num=mineNeighbors(i).filter(n=>mineCells[n].mine).length})}
function mineReveal(i){if(mineOver||mineCells[i].open||mineCells[i].flag)return;if(mineFirst){generateMines(i);mineFirst=false;mineInterval=setInterval(()=>{$("mineTime").textContent=++mineSeconds},1000)}let c=mineCells[i];c.open=true;if(c.mine){mineOver=true;clearInterval(mineInterval);$("mineStatus").textContent="BOOM! Game over!";mineCells.forEach(x=>{if(x.mine)x.open=true});renderMines();return}if(c.num===0)mineNeighbors(i).forEach(n=>mineReveal(n));if(mineCells.every(x=>x.mine||x.open)){mineOver=true;clearInterval(mineInterval);$("mineStatus").textContent="YOU WIN!"}renderMines()}
function mineFlag(i){if(mineOver||mineCells[i].open)return;mineCells[i].flag=!mineCells[i].flag;$("mineCount").textContent=mm-mineCells.filter(x=>x.flag).length;renderMines()}
function renderMines(){let b=$("mineBoard");b.style.gridTemplateColumns=`repeat(${mw},27px)`;b.innerHTML="";mineCells.forEach((c,i)=>{let el=document.createElement("button");el.className="minecell";if(c.open){el.classList.add("open");if(c.mine)el.textContent="✹";else if(c.num)el.textContent=c.num}else if(c.flag)el.textContent="⚑";el.onclick=()=>mineReveal(i);el.oncontextmenu=e=>{e.preventDefault();mineFlag(i)};b.appendChild(el)})}
/* Snake */
function startSnake(){stopSnake();snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];direction={x:1,y:0};score=0;snakeAlive=true;$("snakeScore").textContent=0;spawnFood();drawSnake();snakeLoop=setInterval(updateSnake,120)}
function stopSnake(){clearInterval(snakeLoop);snakeAlive=false}
function spawnFood(){food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}}
function updateSnake(){if(!snakeAlive)return;let h={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(h.x<0||h.x>=15||h.y<0||h.y>=15||snake.some((p,i)=>i!==snake.length-1&&p.x===h.x&&p.y===h.y)){stopSnake();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;$("snakeScore").textContent=score;spawnFood()}else snake.pop();drawSnake()}
function drawSnake(){let c=$("snakeCanvas"),ctx=c.getContext("2d");ctx.fillStyle="#111";ctx.fillRect(0,0,300,300);ctx.fillStyle="red";ctx.fillRect(food.x*20,food.y*20,18,18);ctx.fillStyle="#55ff55";snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18))}
/* Pong */
function startPong(){stopPong();playerY=95;computerY=95;playerScore=computerScore=0;ball={x:200,y:125,dx:4,dy:3};$("pongScore").textContent="0 - 0";pongRunning=true;drawPong();pongLoop=setInterval(updatePong,20)}
function stopPong(){clearInterval(pongLoop);pongRunning=false}
function updatePong(){if(!pongRunning)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.y<5||ball.y>245)ball.dy*=-1;computerY=Math.max(0,Math.min(190,computerY+(ball.y-computerY-30)*.055));if(ball.x<25&&ball.y>playerY&&ball.y<playerY+60)ball.dx=Math.abs(ball.dx);if(ball.x>375&&ball.y>computerY&&ball.y<computerY+60)ball.dx=-Math.abs(ball.dx);if(ball.x<0||ball.x>400){if(ball.x<0)computerScore++;else playerScore++;$("pongScore").textContent=playerScore+" - "+computerScore;ball={x:200,y:125,dx:ball.x<0?4:-4,dy:3};if(playerScore>=5||computerScore>=5){stopPong();return}}drawPong()}
function drawPong(){let c=$("pongCanvas"),ctx=c.getContext("2d");ctx.fillStyle="#111";ctx.fillRect(0,0,400,250);ctx.fillStyle="white";for(let y=0;y<250;y+=20)ctx.fillRect(198,y,4,10);ctx.fillRect(12,playerY,10,60);ctx.fillRect(378,computerY,10,60);ctx.fillRect(ball.x-5,ball.y-5,10,10)}
/* Breakout */
function startBreakout(){stopBreakout();paddle.x=165;brickBall={x:200,y:230,dx:3,dy:-3};bricks=[];for(let r=0;r<4;r++)for(let c=0;c<8;c++)bricks.push({x:8+c*49,y:20+r*24,alive:true});breakRunning=true;$("breakStatus").textContent="Playing!";drawBreakout();breakLoop=setInterval(updateBreakout,20)}
function stopBreakout(){clearInterval(breakLoop);breakRunning=false}
function updateBreakout(){if(!breakRunning)return;brickBall.x+=brickBall.dx;brickBall.y+=brickBall.dy;if(brickBall.x<6||brickBall.x>394)brickBall.dx*=-1;if(brickBall.y<5)brickBall.dy*=-1;if(brickBall.y>270){stopBreakout();$("breakStatus").textContent="Game over!";return}if(brickBall.y>265&&brickBall.x>paddle.x&&brickBall.x<paddle.x+70)brickBall.dy=-Math.abs(brickBall.dy);bricks.forEach(b=>{if(b.alive&&brickBall.x>b.x&&brickBall.x<b.x+44&&brickBall.y>b.y&&brickBall.y<b.y+16){b.alive=false;brickBall.dy*=-1}});if(bricks.every(b=>!b.alive)){stopBreakout();$("breakStatus").textContent="YOU WIN!"}drawBreakout()}
function drawBreakout(){let c=$("breakCanvas"),ctx=c.getContext("2d");ctx.fillStyle="#111";ctx.fillRect(0,0,400,300);bricks.forEach((b,i)=>{if(!b.alive)return;ctx.fillStyle=["#ff5555","#ffaa33","#55cc55","#5599ff"][Math.floor(i/8)];ctx.fillRect(b.x,b.y,44,16)});ctx.fillStyle="white";ctx.fillRect(paddle.x,275,70,10);ctx.beginPath();ctx.arc(brickBall.x,brickBall.y,6,0,Math.PI*2);ctx.fill()}
document.addEventListener("keydown",e=>{const visible=id=>{let w=$("win-"+id);return w&&w.style.display!=="none"};if(snakeAlive&&visible("snake")){let k={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(k[e.key]){let d=k[e.key];if(d.x!==-direction.x||d.y!==-direction.y)direction=d;e.preventDefault()}}if(visible("pong")){if(e.key.toLowerCase()==="w")playerY=Math.max(0,playerY-15);if(e.key.toLowerCase()==="s")playerY=Math.min(190,playerY+15)}if(visible("breakout")){if(e.key==="ArrowLeft")paddle.x=Math.max(0,paddle.x-20);if(e.key==="ArrowRight")paddle.x=Math.min(330,paddle.x+20)}});
function updateClock(){$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
window.addEventListener("beforeunload",()=>{if(audioURL)URL.revokeObjectURL(audioURL);if(videoURL)URL.revokeObjectURL(videoURL)});
boot();
</script>
